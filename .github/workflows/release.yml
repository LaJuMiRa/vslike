name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  release:
    # Apple Silicon runner with Xcode 26 (the app targets macOS 26).
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: engine/global.json

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3 (got $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          if [[ "$(tr -d '[:space:]' < VERSION)" != "$VERSION" ]]; then
            echo "VERSION file does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test, build and package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES="$(awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)"
          printf '%s\n\nSHA-256: `%s`\n' "$NOTES" "${{ steps.package.outputs.sha256 }}" > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.zip }}" \
            "${{ steps.package.outputs.zip }}.sha256" \
            --title "VsLike $VERSION" \
            --notes-file release-notes.md

  tap:
    name: Update the Homebrew cask (pull request)
    needs: release
    runs-on: ubuntu-24.04
    env:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - name: Skip without tap token
        if: ${{ env.TAP_GITHUB_TOKEN == '' }}
        run: echo "TAP_GITHUB_TOKEN is not set; the cask is not updated."
      - uses: actions/checkout@v6
        if: ${{ env.TAP_GITHUB_TOKEN != '' }}
        with:
          path: vslike
      - uses: actions/checkout@v6
        if: ${{ env.TAP_GITHUB_TOKEN != '' }}
        with:
          repository: LaJuMiRa/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap
      - name: Write Casks/vslike.rb only
        if: ${{ env.TAP_GITHUB_TOKEN != '' }}
        run: |
          vslike/packaging/homebrew/render-cask.sh "${{ needs.release.outputs.version }}" "${{ needs.release.outputs.sha256 }}" tap/Casks/vslike.rb
          cd tap
          git status --porcelain --untracked-files=all
          # Only this file may change; existing casks and formulae stay untouched.
          test "$(git status --porcelain --untracked-files=all | grep -vE ' Casks/vslike.rb$' | wc -l)" -eq 0
      - name: Open pull request
        if: ${{ env.TAP_GITHUB_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          cd tap
          branch="vslike-${{ needs.release.outputs.version }}"
          git config user.name "vslike-release"
          git config user.email "vslike-release@users.noreply.github.com"
          git checkout -b "$branch"
          git add Casks/vslike.rb
          git commit -m "vslike ${{ needs.release.outputs.version }}"
          git push --force origin "$branch"
          gh pr create --repo LaJuMiRa/homebrew-tap --head "$branch" --title "vslike ${{ needs.release.outputs.version }}" --body "Automatic update of Casks/vslike.rb from the VsLike release workflow." || echo "PR already exists"
