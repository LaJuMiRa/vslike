    <marker id="diamond" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M0,5 L8,0 L16,5 L8,10 z" fill="#3a3f4b"/></marker>
  </defs>
  <rect x="0" y="0" width="580" height="266" fill="#fbfaf7"/>
